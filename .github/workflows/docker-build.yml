name: Build and Verify Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t docker-aws-editor:latest -f dockerfile .

      - name: Verify Image
        run: |
          docker image inspect docker-aws-editor:latest --format 'Image successfully built: {{.Id}}'
